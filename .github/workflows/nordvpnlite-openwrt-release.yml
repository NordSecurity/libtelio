name: Release nordvpnlite for OpenWrt (aarch64)

# Syncs this fork from upstream, and if that produced new commits, builds
# nordvpnlite for aarch64 musl and publishes it as a release here.
# cjom/GL-MT6000's firmware build consumes the latest release of this repo.

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and republish even without new commits"
        type: boolean
        default: false
  schedule:
    # 21:38 UTC on days 3,6,9...30 -- roughly 4 hours ahead of GL-MT6000's
    # firmware build (cron "38 1 */3 * *" -> 01:38 UTC on days 1,4,7...31),
    # so a fresh binary is always waiting when the firmware build starts.
    - cron: "38 21 3-31/3 * *"

env:
  RUST_TARGET: aarch64-unknown-linux-musl
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: nordvpnlite-openwrt-release
  cancel-in-progress: false

jobs:
  check_commits:
    name: Sync fork and check for new commits
    runs-on: ubuntu-24.04-arm
    outputs:
      new_commits: ${{ steps.check_commits.outputs.new_commits }}
      latest_commit_sha: ${{ steps.check_commits.outputs.latest_commit_sha }}
      short_sha: ${{ steps.check_commits.outputs.short_sha }}
    steps:
      - name: Fast-forward this fork from upstream
        run: |
          # Operates on this repository, so the default token is enough.
          # Only ever fast-forwards/merges -- never force-syncs, so local
          # commits on this branch are not discarded.
          #
          # A failed sync ABORTS the run: nothing is built or published from a
          # fork we could not bring up to date. Note that "already up to date"
          # is a SUCCESS (HTTP 200, merge_type "none"), not a failure -- that is
          # the normal no-new-commits path and must not abort.
          if ! out=$(gh api -X POST "repos/${{ github.repository }}/merge-upstream" \
                       -f branch="${{ github.ref_name }}" 2>&1); then
            echo "*** SYNC/MERGE FAILED - aborting without building ***"
            echo "$out"
            exit 1
          fi
          echo "$out"
          echo "merge_type=$(echo "$out" | jq -r '.merge_type // "unknown"')"

      - name: Check for new commits
        id: check_commits
        run: |
          # Read the sha back from the API: the sync above happened server-side.
          latest_commit_sha=$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" --jq .sha)
          [ -z "$latest_commit_sha" ] && { echo "*** COULD NOT GET latest_commit_sha ***"; exit 1; }
          # The newest release records the commit its binary was built from.
          gh release view --repo "${{ github.repository }}" --json body --jq .body 2>/dev/null \
            | grep -q "${latest_commit_sha}" && echo "new_commits=false" >> $GITHUB_OUTPUT || echo "new_commits=true" >> $GITHUB_OUTPUT
          echo "latest_commit_sha=${latest_commit_sha}"
          echo "latest_commit_sha=${latest_commit_sha}" >> $GITHUB_OUTPUT
          echo "short_sha=${latest_commit_sha:0:7}" >> $GITHUB_OUTPUT

  build:
    name: Build and publish
    needs: check_commits
    # needs.check_commits.result is required explicitly: a custom `if:` replaces
    # the implicit success() gate, so without it a failed sync would still build
    # when dispatched with force.
    if: needs.check_commits.result == 'success' && (needs.check_commits.outputs.new_commits == 'true' || inputs.force)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout at the checked commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check_commits.outputs.latest_commit_sha }}
          submodules: recursive

      - name: Install the cross toolchain
        run: |
          # .cargo/config.toml in this repo hardcodes
          #   [target.aarch64-unknown-linux-musl] linker = "aarch64-linux-gnu-gcc"
          # so this is required even though the runner is already aarch64.
          # The `cc` crate needs it for C dependencies too.
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc --version | head -1

      - name: Set up Rust for ${{ env.RUST_TARGET }}
        run: |
          # ./rust-toolchain pins the toolchain (1.89.0 at time of writing).
          # `rustup show` installs that override first; the target must then be
          # added to the PINNED toolchain, not the runner default -- otherwise
          # the build fails with "can't find crate for `core`".
          rustup show
          rustup target add "${{ env.RUST_TARGET }}"
          rustup target list --installed
          rustc --version && cargo --version

      - name: Build
        env:
          # Root build.rs refuses to build without this (it looks for git hooks
          # that do not exist in a CI checkout).
          BYPASS_LLT_SECRETS: 1
          # Without this, build.rs falls back to "dev-unknown" in --version.
          LIBTELIO_COMMIT_SHA: ${{ needs.check_commits.outputs.short_sha }}
        run: cargo build --release -p nordvpnlite --target "${{ env.RUST_TARGET }}"

      - name: Verify before publishing
        run: |
          BIN="target/${{ env.RUST_TARGET }}/release/nordvpnlite"
          [ -f "$BIN" ] || { echo "*** BINARY NOT PRODUCED ***"; exit 1; }
          file "$BIN"
          file "$BIN" | grep -q "ARM aarch64"     || { echo "*** WRONG ARCHITECTURE ***"; exit 1; }
          file "$BIN" | grep -q "statically linked" || { echo "*** NOT STATIC - will not run on the router ***"; exit 1; }
          # The runner is aarch64, so the binary runs here directly.
          "./$BIN" --version
          "./$BIN" --version | grep -q "${{ needs.check_commits.outputs.short_sha }}" \
            || { echo "*** --version does not report ${{ needs.check_commits.outputs.short_sha }} ***"; exit 1; }
          mkdir -p out
          cp -v "$BIN" out/nordvpnlite
          # Stripped: this lands inside a firmware image.
          aarch64-linux-gnu-strip out/nordvpnlite
          ls -l out/nordvpnlite
          # Ship the OpenWrt package feed from THIS commit alongside the binary.
          # The feed carries the Makefile, init script, config.json and the LuCI
          # app; publishing them together is what guarantees the LuCI page and
          # the binary can never drift apart.
          tar -czf out/openwrt-feed.tar.gz -C clis/nordvpnlite/openwrt feed
          tar -tzf out/openwrt-feed.tar.gz | head -20
          cd out && sha256sum nordvpnlite openwrt-feed.tar.gz > sha256sums && cat sha256sums

      - name: Publish release
        run: |
          TAG="nordvpnlite-${{ needs.check_commits.outputs.short_sha }}"
          gh release delete "$TAG" --cleanup-tag -y --repo "${{ github.repository }}" ||:
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --latest \
            --target "${{ needs.check_commits.outputs.latest_commit_sha }}" \
            --title "nordvpnlite ${{ env.RUST_TARGET }} @ ${{ needs.check_commits.outputs.short_sha }}" \
            --notes "Prebuilt \`nordvpnlite\` for aarch64, consumed by
          [cjom/GL-MT6000](https://github.com/cjom/GL-MT6000) via \`PKG_BINFILE\`
          when building GL-MT6000 firmware.

          - **Commit:** [${{ needs.check_commits.outputs.latest_commit_sha }}](https://github.com/${{ github.repository }}/tree/${{ needs.check_commits.outputs.latest_commit_sha }})
          - **Branch:** ${{ github.ref_name }}
          - **Target:** ${{ env.RUST_TARGET }}
          - **Toolchain:** pinned by \`rust-toolchain\`

          Assets:
          - \`nordvpnlite\` -- statically linked, stripped
          - \`openwrt-feed.tar.gz\` -- the OpenWrt package feed at this same commit
            (Makefile, init script, config.json, LuCI app)

          Rebuilt only when this branch changes." \
            out/nordvpnlite out/openwrt-feed.tar.gz out/sha256sums

      - name: Keep only the 5 most recent nordvpnlite releases
        run: |
          gh api "repos/${{ github.repository }}/releases" \
            --jq '[.[] | select(.tag_name | startswith("nordvpnlite-"))] | .[5:][] | "\(.id) \(.tag_name)"' \
          | while read id tag; do
              gh api -X DELETE "repos/${{ github.repository }}/releases/$id" \
                && gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag" 2>/dev/null ||:
            done
